name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Server URL embedded in the desktop installers
        required: true
        default: http://192.168.1.135:8080
      environment:
        description: Runtime environment (development permits a LAN HTTP server)
        required: true
        type: choice
        options:
          - development
          - production
        default: development

permissions:
  contents: read

env:
  ROXI_API_URL: ${{ inputs.api_url }}
  ROXI_ENVIRONMENT: ${{ inputs.environment }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Roxi-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows EXE and MSI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Roxi-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux AppImage and DEB
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libasound2-dev libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Roxi-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
