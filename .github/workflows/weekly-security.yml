name: Weekly Security Scan

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci && npm audit --json > /tmp/root.json || true
      - run: npm ci && npm audit --json > /tmp/gateway.json || true
        working-directory: gateway
      - run: npm ci && npm audit --json > /tmp/chatbot.json || true
        working-directory: chatbot

      - name: Fail and create issue if high/critical found
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let total = 0;
            for (const f of ['/tmp/root.json', '/tmp/gateway.json', '/tmp/chatbot.json']) {
              try {
                const d = JSON.parse(fs.readFileSync(f));
                total += (d.metadata?.vulnerabilities?.high || 0) + (d.metadata?.vulnerabilities?.critical || 0);
              } catch(e) {}
            }
            if (total > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Security: ${total} high/critical npm vulnerabilities (${new Date().toISOString().slice(0,10)})`,
                body: 'Run `npm audit` in root/, gateway/, and chatbot/ to see details.',
                labels: ['security', 'dependencies']
              });
              core.setFailed(`${total} high/critical vulnerabilities found`);
            }
