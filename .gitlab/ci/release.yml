release:macos:
  stage: test
  tags: [saas-macos-medium-m1]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - npm ci
    - npm run release:mac
  artifacts:
    name: "roxi-${CI_COMMIT_TAG}-macos"
    paths:
      - src-tauri/target/release/bundle/dmg/*.dmg
    expire_in: never

release:windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - Invoke-WebRequest https://nodejs.org/dist/v22.20.0/node-v22.20.0-win-x64.zip -OutFile node22.zip
    - Expand-Archive -LiteralPath node22.zip -DestinationPath .node22 -Force
    - $env:Path = "$PWD\.node22\node-v22.20.0-win-x64;$env:Path"
    - node --version
  script:
    - npm ci
    - npm run release:windows
  artifacts:
    name: "roxi-${CI_COMMIT_TAG}-windows"
    paths:
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/release/bundle/msi/*.msi
    expire_in: never

release:linux:
  stage: test
  image: rust:1-bookworm
  tags: [saas-linux-small-amd64]
  variables:
    APPIMAGE_EXTRACT_AND_RUN: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl xz-utils nodejs npm libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev librsvg2-dev patchelf libxdo-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
  script:
    - npm ci
    - npm run release:linux
  artifacts:
    name: "roxi-${CI_COMMIT_TAG}-linux"
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
    expire_in: never

release:assemble:
  stage: assemble
  image: node:20-bookworm
  needs:
    - job: release:macos
      artifacts: true
    - job: release:windows
      artifacts: true
    - job: release:linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
  script:
    - npm run release:assemble -- --version "$CI_COMMIT_TAG"
  artifacts:
    name: "Roxi-${CI_COMMIT_TAG}-all-platforms"
    paths:
      - release/Roxi-*/
    expire_in: never
